<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="صفحة تسجيل دخول احترافية وآمنة مع واجهة مستخدم جميلة وسهلة الاستخدام. حفظ آمن للبيانات في المتصفح.">
    <meta name="keywords" content="تسجيل دخول، صفحة دخول، login page، حساب مستخدم، نظام دخول آمن">
    <meta name="author" content="elharmen818">
    <meta property="og:title" content="صفحة تسجيل الدخول الاحترافية">
    <meta property="og:description" content="صفحة دخول احترافية مع تصميم حديث وآمن. تسجيل دخول سهل وسريع مع حفظ البيانات.">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#667eea">
    <meta name="robots" content="index, follow">
    <title>صفحة تسجيل الدخول | نظام دخول آمن واحترافي</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            display: flex;
            width: 90%;
            max-width: 1000px;
            height: 600px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
            overflow: hidden;
            animation: slideIn 0.6s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .section-left {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .section-left::before {
            content: "";
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            top: -100px;
            right: -100px;
            z-index: 0;
        }

        .section-left::after {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 50%;
            bottom: -80px;
            left: -80px;
            z-index: 0;
        }

        .section-left-content {
            position: relative;
            z-index: 1;
        }

        .section-left h1 {
            font-size: 2.8em;
            margin-bottom: 20px;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.2;
        }

        .section-left p {
            font-size: 1.08em;
            line-height: 1.8;
            opacity: 0.95;
            margin-bottom: 30px;
            max-width: 380px;
        }

        .decorative-circle {
            width: 150px;
            height: 150px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            position: absolute;
            animation: float 3.5s ease-in-out infinite;
            display: none;
        }

        .decorative-circle:nth-child(1) {
            width: 180px;
            height: 180px;
            top: -40px;
            right: -40px;
        }

        .decorative-circle:nth-child(2) {
            width: 100px;
            height: 100px;
            bottom: 20px;
            left: 30px;
            animation-delay: 1.2s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-25px); }
        }

        .section-right {
            flex: 1;
            padding: 50px 45px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #fafbfc;
        }

        .section-right h2 {
            font-size: 2em;
            color: #2c3e50;
            margin-bottom: 8px;
            text-align: right;
            font-weight: 800;
        }

        .section-right > p {
            color: #7f8c8d;
            margin-bottom: 30px;
            text-align: right;
            font-size: 0.95em;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: 700;
            text-align: right;
            font-size: 0.95em;
        }

        .form-group input {
            width: 100%;
            padding: 13px 16px;
            border: 2px solid #e8eef5;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s ease;
            text-align: right;
            background: white;
            color: #2c3e50;
        }

        .form-group input:hover {
            border-color: #bdc8db;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.12);
            background: #f8faff;
        }

        .form-group input::placeholder {
            color: #bdc8db;
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            font-size: 0.9em;
            text-align: right;
            flex-direction: row-reverse;
        }

        .remember-forgot a {
            color: #667eea;
            text-decoration: none;
            transition: color 0.3s ease;
            font-weight: 600;
        }

        .remember-forgot a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .remember-forgot input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .remember-forgot label {
            cursor: pointer;
            color: #2c3e50;
            margin: 0;
            font-weight: 500;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.05em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.35);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(102, 126, 234, 0.45);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .signup-text {
            margin-top: 22px;
            text-align: center;
            color: #7f8c8d;
            font-size: 0.9em;
        }

        .signup-text a {
            color: #667eea;
            text-decoration: none;
            font-weight: 700;
            transition: color 0.3s ease;
        }

        .signup-text a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .data-display {
            margin-top: 18px;
            padding: 16px 18px;
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.08), rgba(34, 197, 94, 0.04));
            border: 1.5px solid #22c55e;
            border-radius: 12px;
            text-align: right;
            display: none;
            animation: slideDown 0.4s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .data-display.show {
            display: block;
        }

        .data-display h3 {
            color: #22c55e;
            margin-bottom: 10px;
            font-size: 1em;
            font-weight: 700;
        }

        .data-display p {
            color: #059669;
            margin: 6px 0;
            word-break: break-all;
            font-size: 0.9em;
        }

        .data-display strong {
            color: #047857;
            font-weight: 700;
        }

        .error-message {
            display: none;
            margin-top: 12px;
            padding: 12px 14px;
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.08), rgba(239, 68, 68, 0.04));
            border: 1.5px solid #ef4444;
            border-radius: 10px;
            color: #dc2626;
            font-size: 0.9em;
            text-align: right;
            animation: slideDown 0.3s ease-out;
        }

        .error-message.show {
            display: block;
        }

        @media (max-width: 900px) {
            .section-left h1 {
                font-size: 2.2em;
            }

            .section-right {
                padding: 40px 30px;
            }
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                height: auto;
                max-width: 100%;
            }

            .section-left {
                padding: 35px 25px;
                min-height: 280px;
            }

            .section-left h1 {
                font-size: 2em;
            }

            .section-left p {
                font-size: 0.95em;
            }

            .section-right {
                padding: 35px 25px;
                min-height: auto;
            }

            .section-right h2 {
                font-size: 1.6em;
            }

            body {
                padding: 15px;
            }
        }

        @media (max-width: 480px) {
            .container {
                border-radius: 15px;
            }

            .section-left h1 {
                font-size: 1.7em;
            }

            .section-right h2 {
                font-size: 1.3em;
            }

            .form-group input,
            .btn-login {
                font-size: 16px;
            }
        }

        .success-icon {
            display: inline-block;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="section-left">
            <div class="decorative-circle"></div>
            <div class="decorative-circle"></div>
            <div class="section-left-content">
                <h1>أهلاً بك! 👋</h1>
                <p>اختبر تجربة رائعة مع نظامنا الحديث والسهل الاستخدام. نحافظ على أمان بيانتك بكل عناية.</p>
            </div>
        </div>

        <div class="section-right">
            <h2>تسجيل الدخول</h2>
            <p>أدخل بيانات حسابك للمتابعة</p>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="email">البريد الإلكتروني</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="example@email.com" 
                        required
                        aria-label="البريد الإلكتروني"
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="••••••••" 
                        required
                        aria-label="كلمة المرور"
                        autocomplete="current-password"
                    >
                </div>

                <div class="remember-forgot">
                    <a href="#" aria-label="ا��تعادة كلمة المرور">هل نسيت كلمة المرور؟</a>
                    <div class="checkbox-wrapper">
                        <input type="checkbox" id="remember" aria-label="تذكرني">
                        <label for="remember">تذكرني</label>
                    </div>
                </div>

                <button type="submit" class="btn-login">دخول</button>

                <div class="error-message" id="errorMessage"></div>

                <div class="data-display" id="dataDisplay">
                    <h3><span class="success-icon">✅</span>تم حفظ البيانات بنجاح</h3>
                    <p><strong>البريد الإلكتروني:</strong> <span id="displayEmail"></span></p>
                    <p><strong>كلمة المرور:</strong> <span id="displayPassword" style="letter-spacing: 2px;">••••••••</span></p>
                </div>

                <div class="signup-text">
                    ليس لديك حساب؟ <a href="#" aria-label="إنشاء حساب جديد">إنشاء حساب جديد</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Configuration
        const STORAGE_KEY = 'secureLoginUser';
        const MAX_PASSWORD_LENGTH = 128;
        const MIN_PASSWORD_LENGTH = 6;

        // DOM Elements
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const dataDisplay = document.getElementById('dataDisplay');
        const displayEmail = document.getElementById('displayEmail');
        const displayPassword = document.getElementById('displayPassword');
        const errorMessage = document.getElementById('errorMessage');

        // Validate email format
        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email) && email.length <= 254;
        }

        // Validate password strength
        function validatePassword(password) {
            if (password.length < MIN_PASSWORD_LENGTH) {
                return { valid: false, message: `كلمة المرور يجب أن تكون على الأقل ${MIN_PASSWORD_LENGTH} أحرف` };
            }
            if (password.length > MAX_PASSWORD_LENGTH) {
                return { valid: false, message: `كلمة المرور طويلة جداً` };
            }
            return { valid: true, message: '' };
        }

        // Show error message
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 4000);
        }

        // Save user data securely
        function saveUser(user) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    email: user.email,
                    timestamp: new Date().toISOString(),
                    passwordHint: '••••••••'
                }));
            } catch (e) {
                console.error('Failed to save user data:', e);
            }
        }

        // Remove user data
        function removeUser() {
            try {
                localStorage.removeItem(STORAGE_KEY);
            } catch (e) {
                console.error('Failed to remove user data:', e);
            }
        }

        // Get saved user
        function getSavedUser() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                return data ? JSON.parse(data) : null;
            } catch (e) {
                console.error('Failed to retrieve user data:', e);
                return null;
            }
        }

        // Handle form submission
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            // Clear previous error
            errorMessage.classList.remove('show');

            // Validate email
            if (!email) {
                showError('يرجى إدخال البريد الإلكتروني');
                return;
            }

            if (!isValidEmail(email)) {
                showError('البريد الإلكتروني غير صحيح');
                return;
            }

            // Validate password
            if (!password) {
                showError('يرجى إدخال كلمة المرور');
                return;
            }

            const passwordValidation = validatePassword(password);
            if (!passwordValidation.valid) {
                showError(passwordValidation.message);
                return;
            }

            // Save user data
            const user = { email, password };
            saveUser(user);

            // Display success message
            displayEmail.textContent = email;
            displayPassword.textContent = '••••••••';
            dataDisplay.classList.add('show');

            // Log to console for debugging
            console.log('✅ Login successful:', { email: email, timestamp: new Date().toISOString() });

            // Optional: Reset form after 2 seconds
            setTimeout(() => {
                // loginForm.reset();
            }, 2000);
        });

        // Load saved user on page load
        window.addEventListener('load', function() {
            const savedUser = getSavedUser();
            if (savedUser && savedUser.email) {
                displayEmail.textContent = savedUser.email;
                displayPassword.textContent = '••••••••';
                dataDisplay.classList.add('show');
                console.log('✅ User loaded from storage:', savedUser.email);
            }
        });

        // Add real-time email validation
        emailInput.addEventListener('blur', function() {
            if (this.value && !isValidEmail(this.value.trim())) {
                this.style.borderColor = '#ef4444';
            } else {
                this.style.borderColor = '';
            }
        });

        // Clean up on page unload
        window.addEventListener('beforeunload', function() {
            // Optional: Clear data on close if needed
            // removeUser();
        });
    </script>
